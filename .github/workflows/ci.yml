name: CI Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot & JaCoCo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run Maven verify (Unit/Integration Tests & JaCoCo Check)
        working-directory: backend
        run: ./mvnw clean verify --no-transfer-progress

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend (Flutter & lcov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter analyzer (linter)
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter tests with coverage
        working-directory: frontend
        run: flutter test --coverage

      - name: Verify code coverage threshold (>= 80%)
        working-directory: frontend
        run: python tool/check_coverage.py

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lcov-report
          path: frontend/coverage/
          retention-days: 14

  docs:
    name: Documentation Consistency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate documentation with check_docs.py
        run: python .agent/skills/documentacao-projeto/scripts/check_docs.py .

